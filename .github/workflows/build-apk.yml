name: Build Distra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Distra
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]"

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Show project files
        run: |
          echo "=== Project files ==="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Build Distra APK
        run: |
          flet build apk --verbose

      - name: Find APK
        if: always()
        run: |
          echo "=== Generated APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload Distra APK
        uses: actions/upload-artifact@v4
        with:
          name: Distra-APK
          path: "**/*.apk"
          if-no-files-found: error
