name: Build Distra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Distra
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Detect Python entry point
        shell: bash
        run: |
          echo "Python files in project:"
          find . -maxdepth 2 -type f -name "*.py" -print

          if [ -f "main.py" ]; then
            echo "main.py already exists."
            exit 0
          fi

          if [ -f "304414" ]; then
            echo "Renaming 304414 to main.py for the build."
            cp "304414" "main.py"
            exit 0
          fi

          if [ -f "304414.py" ]; then
            echo "304414.py found."
            cp "304414.py" "main.py"
            exit 0
          fi

          echo "ERROR: Could not find the Distra Python entry point."
          exit 1

      - name: Verify Python entry point
        run: |
          test -f main.py
          python -m py_compile main.py

      - name: Build Distra APK
        run: |
          flet build apk --verbose

      - name: Find APK
        if: always()
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload Distra APK
        uses: actions/upload-artifact@v4
        with:
          name: Distra-APK
          path: "**/*.apk"
          if-no-files-found: error
